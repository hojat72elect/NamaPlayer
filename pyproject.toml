[project]
name = "nama-player"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ttkbootstrap>=2.2.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "vulture>=2.16",
     "pytest>=9.1.1",
]

[tool.ruff]
line-length = 400
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
